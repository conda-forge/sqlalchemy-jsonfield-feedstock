schema_version: 1

context:
  name: sqlalchemy-jsonfield
  version: "1.0.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sqlalchemy_jsonfield-${{ version }}.tar.gz
  sha256: 162099ff6b6f475105afff90b15da114cbd87fd18df94e7d091df9f9d0e4f69f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=80.3.0
    - setuptools_scm >=6.2
  run:
    - python >=${{ python_min }}
    - sqlalchemy

tests:
  - python:
      imports:
        - sqlalchemy_jsonfield
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: SQLAlchemy JSONField implementation for storing dicts at SQL independently from JSON type support.
  description: |
    SqlAlchemy provides JSON field support for several database types
    (PostgreSQL and MySQL for now) and semi-working dict <-> JSON <-> VARCHAR
    example, but... In real scenarios we have tests on sqlite, production on
    MySQL/MariaDB/Percona/PostgreSQL and some of them (modern Oracle MySQL &
    PostgreSQL) support JSON, some of them (SQLite, Percona & MariaDB) requires
    data conversion to Text (not VARCHAR).

    As addition, we have different levels of Unicode support on database and
    connector side, so we may be interested to switch JSON encoding between d
    eployments.
  homepage: https://github.com/penguinolog/sqlalchemy_jsonfield
  repository: https://github.com/penguinolog/sqlalchemy_jsonfield
  documentation: https://github.com/penguinolog/sqlalchemy_jsonfield

extra:
  recipe-maintainers:
    - xylar
